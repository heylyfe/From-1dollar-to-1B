<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#202d27">
  <meta name="description" content="Walk, work and build your own businesses in a mobile browser tycoon.">
  <title>From $1 to $1 Billion</title>
  <link rel="icon" href="./assets/emblem.svg">
  <link rel="stylesheet" href="./style.css">
  <script defer src="./data.js"></script>
  <script defer src="./economy.js"></script>
  <script defer src="./save.js"></script>
  <script defer src="./field-data.js"></script>
  <script defer src="./operations.js"></script>
  <script defer src="./renderer.js"></script>
  <script defer src="./game.js"></script>
</head>
<body>
  <header id="top"><div class="bar">
    <a class="brand" href="./index.html" aria-label="From $1 to $1 Billion"><img src="./assets/emblem.svg" alt="" width="39" height="39"><span><strong>From $1 to $1 Billion</strong><small>BUSINESS TYCOON</small></span></a>
    <div id="header-actions"></div>
  </div></header>
  <main id="main">
    <div class="page-head">
      <div><span id="zone"></span><h1 id="location">Maplebrook</h1></div>
      <div class="statbar" id="stats" aria-label="Campaign finances"></div>
    </div>
    <div class="play-layout">
      <section class="play-panel" aria-label="Playable neighbourhood">
        <div class="viewport">
          <canvas id="world" tabindex="0" aria-label="Playable business district. Move with W A S D, arrow keys, or the on-screen joystick. Press E at doors and construction lots."></canvas>
          <div class="live-label" id="scene-tag"></div>
          <div class="inventory" id="inventory"></div>
          <div class="joystick" id="joystick" aria-label="Drag joystick to move"><div class="stick-knob"></div><i class="joy-n"></i><i class="joy-e"></i><i class="joy-s"></i><i class="joy-w"></i></div>
          <div class="context" id="context" aria-live="off"></div>
          <noscript><p>Enable JavaScript to play.</p></noscript>
        </div>
        <div class="play-foot"><span id="move-help"></span><span id="orders-count"></span></div>
      </section>
      <aside id="fieldbook" aria-label="Current work and objectives"></aside>
    </div>
  </main>
  <nav id="nav" aria-label="Game menus"><div class="nav-inner"></div></nav>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
